[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "star-reasoning"
version = "0.1.0"
description = "STaR: local self-taught reasoning on Apple Silicon and CPU"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE.txt"}
dependencies = [
  "torch==2.8.0",
  "transformers==4.51.3",
  "numpy==2.2.6",
  "safetensors==0.5.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.13"]

[project.scripts]
star = "star.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
